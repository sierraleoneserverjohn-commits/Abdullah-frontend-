<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Abdullah AI for Sana</title>

  <!-- Modular CSS Imports -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/orb.css" />
  <link rel="stylesheet" href="css/voice-card.css" />
  <link rel="stylesheet" href="css/nav.css" />
</head>
<body>

  <div id="app">
    <!-- Header Component -->
    <header class="app-header">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <span class="brand-title">Abdullah AI</span>
      <button class="icon-btn" id="favBtn" aria-label="Favorites">
        <svg viewBox="0 0 24 24" fill="#ff3b8b"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
    </header>

    <!-- Main View Viewport -->
    <main class="main-content">
      <section class="greeting">
        <p class="greeting-sub">Good Evening,</p>
        <h1 class="greeting-title">Sana 💖</h1>
      </section>

      <!-- Orb Component -->
      <section class="orb-container">
        <div class="orb" id="aiOrb">
          <div class="orb-eyes">
            <div class="eye left"></div>
            <div class="eye right"></div>
          </div>
          <div class="orb-smile"></div>
        </div>
      </section>

      <!-- Voice Control Component -->
      <section class="voice-card">
        <h3 id="voiceStatusTitle">Tap to talk</h3>
        <p id="voiceStatusSub">I'm listening...</p>
        <div class="voice-actions">
          <button class="mic-btn" id="micBtn" aria-label="Microphone">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
          </button>
        </div>
      </section>
    </main>

    <!-- Bottom Nav Component -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home">Home</button>
      <button class="nav-item" data-tab="chat">Chat</button>
      <button class="nav-item" data-tab="memory">Memory</button>
    </nav>
  </div>

  <!-- Entry Point JavaScript Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
