<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line locks the zoom and forces mobile viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abdullah AI for Sana</title>
  
  <!-- THIS IS WHAT WAS MISSING: The links to your styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <!-- Starry Background (Behind everything) -->
    <canvas id="particles-canvas" class="particles-canvas"></canvas>

    <!-- Top Header -->
    <header class="app-header">
      <button class="icon-btn" id="menuBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d0b8e6" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="header-actions">
        <button class="icon-btn" id="crownBtn">👑</button>
        <button class="icon-btn" id="topHeartBtn">💖</button>
      </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content" id="mainView">
      
      <!-- Greeting -->
      <div class="greeting-section">
        <p class="greeting-title">Good evening,</p>
        <h1 class="sana-name">Sana 💖</h1>
        <p class="greeting-subtitle">I'm here whenever you need me. ✨</p>
      </div>

      <!-- Glowing AI Orb -->
      <div class="ai-orb-container">
        <div class="ai-orb-face">
          <div class="ai-eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="ai-smile"></div>
        </div>
      </div>

      <p class="signature-tag">Made with 💖 for Sana</p>

      <!-- Tap to Talk Box -->
      <div class="control-box">
        <h3 class="tap-title">Tap to talk</h3>
        <p class="tap-sub">I'm listening...</p>
        
        <div class="mic-controls">
          <button class="side-btn" id="sparkleBtn">✨</button>
          <button class="mic-btn-large" id="micBtn">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ff3b8b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
          </button>
          <button class="side-btn" id="keyboardBtn">⌨️</button>
        </div>
      </div>

      <!-- Helper Grid -->
      <div class="helper-section">
        <h4 class="helper-title" style="margin-bottom: 12px; font-weight: 500;">How can I help you today? 💖</h4>
        <div class="action-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%;">
          <button class="action-card" id="actionChat" style="background: rgba(20, 10, 30, 0.6); border: 1px solid rgba(255, 59, 139, 0.2); padding: 15px; border-radius: 16px; display: flex; align-items: center; gap: 10px; color: #fff; text-align: left;">
             <span class="card-icon" style="font-size: 20px;">💬</span>
             <div class="card-text">
               <strong style="display: block; font-size: 14px;">Let's Chat</strong>
               <span style="font-size: 11px; color: #9a82b8;">Talk about anything</span>
             </div>
          </button>
          <button class="action-card" id="actionLove" style="background: rgba(20, 10, 30, 0.6); border: 1px solid rgba(255, 59, 139, 0.2); padding: 15px; border-radius: 16px; display: flex; align-items: center; gap: 10px; color: #fff; text-align: left;">
             <span class="card-icon" style="font-size: 20px;">💌</span>
             <div class="card-text">
               <strong style="display: block; font-size: 14px;">Love Notes</strong>
               <span style="font-size: 11px; color: #9a82b8;">Sweet words for you</span>
             </div>
          </button>
          <button class="action-card" id="actionTeach" style="background: rgba(20, 10, 30, 0.6); border: 1px solid rgba(255, 59, 139, 0.2); padding: 15px; border-radius: 16px; display: flex; align-items: center; gap: 10px; color: #fff; text-align: left;">
             <span class="card-icon" style="font-size: 20px;">📚</span>
             <div class="card-text">
               <strong style="display: block; font-size: 14px;">Teach Me</strong>
               <span style="font-size: 11px; color: #9a82b8;">Learn anything new</span>
             </div>
          </button>
          <button class="action-card" id="actionMood" style="background: rgba(20, 10, 30, 0.6); border: 1px solid rgba(255, 59, 139, 0.2); padding: 15px; border-radius: 16px; display: flex; align-items: center; gap: 10px; color: #fff; text-align: left;">
             <span class="card-icon" style="font-size: 20px;">🎵</span>
             <div class="card-text">
               <strong style="display: block; font-size: 14px;">Mood Booster</strong>
               <span style="font-size: 11px; color: #9a82b8;">Cheer you up</span>
             </div>
          </button>
        </div>
      </div>
      
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" id="navHome" style="background: transparent; border: none; color: #ff3b8b; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="nav-icon" style="font-size: 20px;">🏠</span>
        <span class="nav-label" style="font-size: 10px;">Home</span>
      </button>
      <button class="nav-item" id="navChat" style="background: transparent; border: none; color: #9a82b8; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="nav-icon" style="font-size: 20px;">💬</span>
        <span class="nav-label" style="font-size: 10px;">Chat</span>
      </button>
      
      <!-- Big Center Heart Button -->
      <div class="nav-center-wrapper" style="position: relative; top: -15px;">
        <button class="nav-center-btn" id="navCenterHeart" style="width: 60px; height: 60px; border-radius: 50%; background: #0a0410; border: 2px solid #ff3b8b; box-shadow: 0 0 15px rgba(255,59,139,0.5); font-size: 24px; display: flex; justify-content: center; align-items: center;">💖</button>
      </div>

      <button class="nav-item" id="navMemory" style="background: transparent; border: none; color: #9a82b8; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="nav-icon" style="font-size: 20px;">🧠</span>
        <span class="nav-label" style="font-size: 10px;">Memory</span>
      </button>
      <button class="nav-item" id="navProfile" style="background: transparent; border: none; color: #9a82b8; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="nav-icon" style="font-size: 20px;">👤</span>
        <span class="nav-label" style="font-size: 10px;">Sana</span>
      </button>
    </nav>
  </div>

  <!-- Scripts linked at the bottom so logic works -->
  <script src="js/config.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
