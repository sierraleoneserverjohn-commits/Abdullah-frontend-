<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Abdullah AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="voice.css" />
</head>
<body>

  <!-- Backdrop overlay when mobile sidebar opens -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-container">
    
    <!-- SIDEBAR (SLIDES OUT ON MOBILE) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        
        <!-- User Profile -->
        <div class="user-profile">
          <img src="https://github.com/github.png" alt="Abdullah Profile" class="user-avatar" />
          <span class="user-name">Abdullah</span>
          <!-- Close button for mobile -->
          <button class="close-sidebar-btn" id="close-sidebar-btn">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Live Voice Button -->
        <button class="btn-live-sidebar" id="voice-trigger-btn">
          <i class="fa-solid fa-phone" id="voice-icon"></i>
          <span id="voice-status-text">Start Live Voice</span>
        </button>

        <!-- Recent Chats -->
        <div class="recent-section">
          <h3 class="recent-title">Recent Chats</h3>
          <button class="recent-item">
            <i class="fa-regular fa-message"></i>
            <span>Groq Llama 3.3 Setup</span>
          </button>
          <button class="recent-item">
            <i class="fa-regular fa-message"></i>
            <span>Gemini Live API Voice</span>
          </button>
        </div>
      </div>

      <!-- Real-Time API Tracker -->
      <div class="api-tracker">
        <div class="api-tracker-header">
          <i class="fa-solid fa-chart-line"></i>
          <span>Real-Time API Tracking</span>
        </div>
        <div class="api-status-row">
          <span>Groq (Llama 3.3):</span>
          <span class="status-active"><span class="dot"></span> 12ms</span>
        </div>
        <div class="api-status-row">
          <span>Gemini Live:</span>
          <span id="gemini-status" class="status-standby">Standby</span>
        </div>
      </div>
    </aside>

    <!-- MAIN SCREEN (100% WIDTH ON MOBILE) -->
    <main class="main-screen">
      
      <!-- Header with Mobile Menu Button -->
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" title="Open Menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="ai-brand">
            <div class="ai-avatar">
              <i class="fa-solid fa-bolt"></i>
            </div>
            <span class="ai-title">Abdullah AI</span>
          </div>
        </div>
        <div class="badge">Groq & Gemini</div>
      </header>

      <!-- Scrollable Chat Area -->
      <section class="chat-area" id="chat-box">
        <!-- Dynamic Messages Render Here -->
      </section>

      <!-- Fixed Typing Bar -->
      <div class="typing-container">
        <div class="typing-bar">
          <button class="btn-icon" id="plus-btn" title="Add Document">
            <i class="fa-solid fa-plus"></i>
          </button>
          <input type="file" id="file-input" hidden />

          <textarea id="chat-input" rows="1" placeholder="Type a message..."></textarea>

          <button class="btn-action" id="action-btn">
            <i class="fa-solid fa-microphone" id="action-icon"></i>
          </button>
        </div>
      </div>

    </main>
  </div>

  <script src="voice.js"></script>
  <script src="app.js"></script>
</body>
</html>
