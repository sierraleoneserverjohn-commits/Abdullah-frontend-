<div class="page-container page-fade">
  <div class="glass-card">
    <h2 style="font-size:20px; color:var(--text-main); margin-bottom:6px;">Sana's Memory Vault 🧠</h2>
    <p style="font-size:13px; color:var(--text-sub);">Special moments and preferences Abdullah AI remembers for you.</p>
  </div>

  <div class="glass-card" style="display:flex; gap:8px;">
    <input type="text" id="memoryInput" placeholder="Add a new memory or note..." style="flex:1; background:rgba(30, 14, 48, 0.8); border:1px solid var(--bg-card-border); border-radius:12px; padding:10px 14px; color:#fff; outline:none;" />
    <button id="addMemoryBtn" class="icon-btn" style="background:var(--primary-pink);">+ Add</button>
  </div>

  <div id="memoryList" style="display:flex; flex-direction:column; gap:10px;">
    <!-- Memory items rendered via JS -->
  </div>
</div>
