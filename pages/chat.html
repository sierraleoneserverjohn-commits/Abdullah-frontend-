<div class="page-container page-fade">
  <div class="chat-header glass-card" style="display:flex; justify-between; align-items:center; margin-bottom:12px;">
    <div>
      <h2 style="font-size:18px; color:var(--text-main);">Chat with Abdullah AI</h2>
      <p style="font-size:12px; color:var(--text-sub);">Always here for you, Sana</p>
    </div>
    <button class="icon-btn" id="clearChatBtn" title="Clear Chat">🗑️</button>
  </div>

  <div id="chatMessages" class="chat-messages" style="height: calc(100vh - 280px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px;">
    <div class="message ai-msg glass-card" style="align-self: flex-start; max-width: 80%; border-radius: 18px 18px 18px 4px; padding: 12px 16px;">
      Hello my dear Sana! ❤️ How has your day been?
      <span class="time" style="display:block; font-size:10px; color:var(--text-sub); margin-top:4px;">Just now</span>
    </div>
  </div>

  <div class="chat-input-row" style="display:flex; gap:8px; margin-top:10px;">
    <input type="text" id="chatInput" placeholder="Type your message..." style="flex:1; background:rgba(30, 14, 48, 0.8); border:1px solid var(--bg-card-border); border-radius:24px; padding:12px 18px; color:#fff; outline:none;" />
    <button id="sendChatBtn" class="mic-btn" style="width:48px; height:48px; min-width:48px;">
      <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:#fff;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>
