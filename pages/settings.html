<div class="page-container page-fade">
  <div class="glass-card">
    <h2 style="font-size:20px; color:var(--text-main); margin-bottom:16px;">App Settings ⚙️</h2>
    
    <!-- Model Selector (Limited strictly to the 5 models) -->
    <div style="margin-bottom:20px;">
      <label style="display:block; font-size:12px; color:var(--text-sub); margin-bottom:6px;">Select AI Engine</label>
      <select id="modelSelectInput" style="width:100%; background:rgba(30, 14, 48, 0.8); border:1px solid rgba(255,105,180,0.2); border-radius:12px; padding:12px; color:#fff; outline:none;">
      </select>
      <span style="font-size:10px; color:var(--text-sub); margin-top:6px; display:block;">API keys are securely managed on the backend.</span>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <span>Voice Assistance</span>
      <input type="checkbox" id="settingVoice" checked style="accent-color:var(--primary-pink); width:20px; height:20px;" />
    </div>

    <button id="saveSettingsBtn" style="width:100%; padding:14px; border-radius:12px; background:linear-gradient(135deg, #ff3b8b, #b522ff); border:none; color:#fff; font-weight:600; cursor:pointer;">Save Configuration</button>
  </div>
</div>
