<div class="page-container page-fade">
  <div class="glass-card">
    <h2 style="font-size:20px; color:var(--text-main); margin-bottom:16px;">Settings ⚙️</h2>
    
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <span>Voice Assistance</span>
      <input type="checkbox" id="settingVoice" checked style="accent-color:var(--primary-pink); width:20px; height:20px;" />
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <span>Auto-Speak Responses</span>
      <input type="checkbox" id="settingAutoSpeak" checked style="accent-color:var(--primary-pink); width:20px; height:20px;" />
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <span>Glow & Visual Effects</span>
      <input type="checkbox" id="settingAnimations" checked style="accent-color:var(--primary-pink); width:20px; height:20px;" />
    </div>

    <button id="resetDataBtn" style="width:100%; padding:12px; border-radius:12px; background:rgba(255,59,139,0.2); border:1px solid var(--primary-pink); color:#fff; font-weight:600; margin-top:10px; cursor:pointer;">Reset App Local Storage</button>
  </div>
</div>
